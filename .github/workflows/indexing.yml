name: Google Instant Sitemap Indexing

on:
  push:
    branches:
      - main
  schedule:
    # Har 6 ghante baad auto-check karega
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install googleapis axios xml2js

      - name: Run Sitemap Indexer Script
        env:
          GCP_JSON_KEY: ${{ secrets.GCP_JSON_KEY }}
          SITEMAP_URL: "https://indexer-hub.vercel.app/sitemap.xml"
        run: |
          cat << 'EOF' > indexer.js
          const { google } = require('googleapis');
          const axios = require('axios');
          const xml2js = require('xml2js');

          async function processSitemap() {
            try {
              const key = JSON.parse(process.env.GCP_JSON_KEY);
              const jwtClient = new google.auth.JWT(
                key.client_email,
                null,
                key.private_key,
                ['https://www.googleapis.com/auth/indexing'],
                null
              );

              await jwtClient.authorize();
              const indexing = google.indexing({ version: 'v3', auth: jwtClient });

              console.log('Fetching sitemap from:', process.env.SITEMAP_URL);
              const response = await axios.get(process.env.SITEMAP_URL);
              const parser = new xml2js.Parser();
              const result = await parser.parseStringPromise(response.data);

              let urls = [];
              if (result.urlset && result.urlset.url) {
                urls = result.urlset.url.map(u => u.loc[0]);
              }

              console.log(`Found ${urls.length} URLs in sitemap.`);

              for (const url of urls) {
                try {
                  const res = await indexing.urlNotifications.publish({
                    requestBody: {
                      url: url,
                      type: 'URL_UPDATED'
                    }
                  });
                  console.log(`Successfully submitted: ${url}`);
                } catch (err) {
                  console.error(`Error indexing ${url}:`, err.message);
                }
              }
            } catch (error) {
              console.error('Script Error:', error.message);
            }
          }

          processSitemap();
          EOF
          node indexer.js
